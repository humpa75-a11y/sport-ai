<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>De Meester ⚡ AI Football Predictions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --success-gradient: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --gold-gradient: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            --dark-bg: #1a1a2e;
            --card-bg: #ffffff;
            --text-primary: #2d3748;
            --shadow-lg: 0 10px 40px rgba(0,0,0,0.1);
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding-bottom: 50px;
        }
        
        .navbar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            border: none;
        }
        
        .navbar-brand {
            font-weight: 800;
            font-size: 1.5rem;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .container-main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 15px;
        }
        
        .card {
            border-radius: 20px;
            border: none;
            background: var(--card-bg);
            box-shadow: var(--shadow-lg);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }
        
        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }
        
        .card-header {
            background: transparent;
            border: none;
            padding: 25px;
            font-weight: 700;
            font-size: 1.3rem;
            color: var(--text-primary);
        }
        
        .card-body {
            padding: 25px;
        }
        
        /* 🏆 GOUDEN WEDSTRIJDEN SECTIE */
        .golden-section {
            background: var(--gold-gradient);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 15px 50px rgba(255, 215, 0, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        .golden-section::before {
            content: '✨';
            position: absolute;
            font-size: 150px;
            opacity: 0.1;
            right: -20px;
            top: -30px;
            animation: sparkle 3s infinite;
        }
        
        @keyframes sparkle {
            0%, 100% { opacity: 0.1; transform: rotate(0deg); }
            50% { opacity: 0.2; transform: rotate(10deg); }
        }
        
        .golden-title {
            color: white;
            font-weight: 900;
            font-size: 2.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
            margin-bottom: 10px;
        }
        
        .golden-subtitle {
            color: rgba(255,255,255,0.9);
            font-size: 1.1rem;
            margin-bottom: 25px;
        }
        
        .btn-golden {
            background: white;
            color: #FFA500;
            border: none;
            padding: 18px 45px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 50px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
            position: relative;
            z-index: 1;
        }
        
        .btn-golden:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 35px rgba(0,0,0,0.3);
            color: #FF8C00;
        }
        
        .golden-match-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin: 15px 0;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }
        
        .golden-match-card .match-teams {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 15px;
        }
        
        .golden-match-card .match-score {
            font-size: 3rem;
            font-weight: 900;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .perfect-scores {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            flex-wrap: wrap;
        }
        
        .score-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 1.1rem;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
            flex: 1;
            min-width: 100px;
            text-align: center;
        }
        
        .score-probability {
            font-size: 0.85rem;
            opacity: 0.9;
            margin-top: 5px;
        }
        
        /* PREDICTION CARD STYLING */
        .prediction-result {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            padding: 35px;
            color: white;
            margin-top: 25px;
        }
        
        .prediction-score {
            font-size: 4rem;
            font-weight: 900;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
            margin: 20px 0;
        }
        
        .confidence-bar {
            height: 30px;
            background: rgba(255,255,255,0.2);
            border-radius: 15px;
            overflow: hidden;
            margin: 20px 0;
        }
        
        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #4ade80 0%, #22c55e 100%);
            border-radius: 15px;
            transition: width 1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
        }
        
        .btn-predict {
            background: var(--primary-gradient);
            border: none;
            padding: 15px 35px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 50px;
            color: white;
            transition: all 0.3s ease;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        
        .btn-predict:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 35px rgba(102, 126, 234, 0.6);
            color: white;
        }
        
        .form-control {
            border-radius: 12px;
            border: 2px solid #e2e8f0;
            padding: 12px 18px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        
        .status-card {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
        }
        
        .status-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }
        
        .status-item:last-child {
            border-bottom: none;
        }
        
        .badge-custom {
            background: rgba(255,255,255,0.3);
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .toast-container {
            z-index: 9999;
        }
        
        @media (max-width: 768px) {
            .golden-title {
                font-size: 1.8rem;
            }
            .prediction-score {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="bi bi-stars"></i> De Meester AI
            </a>
            <span class="badge bg-success">V2 DEEP LEARNING</span>
        </div>
    </nav>

    <div class="container-main">
        
        <!-- 🏆 GOUDEN WEDSTRIJDEN SECTIE 🏆 -->
        <div class="golden-section">
            <div class="text-center">
                <h1 class="golden-title">🏆 Gouden Wedstrijden</h1>
                <p class="golden-subtitle">De 2 beste kansen van vandaag - AI-geselecteerd met hoogste confidence</p>
                <button class="btn btn-golden" id="generateGoldenBtn">
                    <i class="bi bi-trophy-fill"></i> Genereer Gouden Wedstrijden
                </button>
                
                <div id="goldenMatchesContainer" class="mt-4"></div>
            </div>
        </div>

        <div class="row">
            <!-- Hoofdkolom -->
            <div class="col-lg-8">
                <!-- Voorspelling Card -->
                <div class="card mb-4">
                    <div class="card-header">
                        <i class="bi bi-lightning-charge-fill"></i> Ultimate Prediction
                    </div>
                    <div class="card-body">
                        <form id="predictionForm">
                            <div class="row g-3">
                                <div class="col-md-5">
                                    <label class="form-label fw-bold">Thuisploeg</label>
                                    <input type="text" class="form-control" id="homeTeam" placeholder="bv. Manchester City" required>
                                </div>
                                <div class="col-md-5">
                                    <label class="form-label fw-bold">Uitploeg</label>
                                    <input type="text" class="form-control" id="awayTeam" placeholder="bv. Arsenal" required>
                                </div>
                                <div class="col-md-2">
                                    <label class="form-label fw-bold">Ronde</label>
                                    <input type="number" class="form-control" id="speelronde" value="19" min="1" max="38">
                                </div>
                            </div>
                            <button type="submit" class="btn btn-predict w-100 mt-4">
                                <span id="predictSpinner" class="loading-spinner d-none"></span>
                                <span id="predictText">Voorspel Wedstrijd</span>
                            </button>
                        </form>
                        
                        <div id="predictionResult"></div>
                    </div>
                </div>
            </div>

            <!-- Zijkolom -->
            <div class="col-lg-4">
                <!-- Status Card -->
                <div class="status-card">
                    <h5 class="mb-3"><i class="bi bi-cpu-fill"></i> AI Status</h5>
                    <div id="statusContainer">
                        <div class="text-center">
                            <div class="loading-spinner"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE_URL = 'http://127.0.0.1:5000/api';

        // Utility Functions
        const showToast = (message, type = 'info') => {
            const toastContainer = document.querySelector('.toast-container');
            const toastId = 'toast-' + Date.now();
            const bgClass = type === 'success' ? 'bg-success' : type === 'danger' ? 'bg-danger' : 'bg-info';
            const toastHTML = `
                <div id="${toastId}" class="toast align-items-center text-white ${bgClass}" role="alert">
                    <div class="d-flex">
                        <div class="toast-body">${message}</div>
                        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                    </div>
                </div>
            `;
            toastContainer.insertAdjacentHTML('beforeend', toastHTML);
            const toastElement = document.getElementById(toastId);
            const toast = new bootstrap.Toast(toastElement, { delay: 4000 });
            toast.show();
            toastElement.addEventListener('hidden.bs.toast', () => toastElement.remove());
        };

        const apiCall = async (endpoint, options = {}) => {
            try {
                const response = await fetch(`${API_BASE_URL}${endpoint}`, options);
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({ error: 'Server error' }));
                    throw new Error(errorData.error || `HTTP ${response.status}`);
                }
                return await response.json();
            } catch (error) {
                console.error(`API Error (${endpoint}):`, error);
                showToast(`Fout: ${error.message}`, 'danger');
                return null;
            }
        };

        // 🏆 GOUDEN WEDSTRIJDEN FUNCTIE
        document.getElementById('generateGoldenBtn').addEventListener('click', async () => {
            const btn = document.getElementById('generateGoldenBtn');
            const container = document.getElementById('goldenMatchesContainer');
            
            btn.disabled = true;
            btn.innerHTML = '<span class="loading-spinner"></span> Analyzing LIVE matches...';
            container.innerHTML = '<div class="text-center"><div class="loading-spinner"></div><p class="text-white mt-3">AI haalt ECHTE wedstrijden op en analyseert...</p></div>';
            
            const data = await apiCall('/golden-matches');
            
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-trophy-fill"></i> Genereer Gouden Wedstrijden';
            
            if (!data || !data.golden_matches) {
                container.innerHTML = '<p class="text-white">Kon geen gouden wedstrijden vinden</p>';
                return;
            }
            
            // Format kickoff tijd
            const formatKickoff = (isoTime) => {
                const date = new Date(isoTime);
                const today = new Date();
                const tomorrow = new Date(today);
                tomorrow.setDate(tomorrow.getDate() + 1);
                
                const isToday = date.toDateString() === today.toDateString();
                const isTomorrow = date.toDateString() === tomorrow.toDateString();
                
                const timeStr = date.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
                
                if (isToday) return `🔴 VANDAAG ${timeStr}`;
                if (isTomorrow) return `📅 MORGEN ${timeStr}`;
                return `📅 ${date.toLocaleDateString('nl-NL')} ${timeStr}`;
            };
            
            let html = `<div class="alert alert-success mt-3" role="alert">
                <strong>✅ ${data.total_evaluated} wedstrijden geanalyseerd uit ${data.total_available} beschikbare matches!</strong><br>
                <small><strong>Data Bronnen:</strong> ${data.sources_used.join(', ')}</small><br>
                <small><strong>API Status:</strong> 
                    API-Football: ${data.api_status.api_football === 'active' ? '🟢 Active' : '⚪ No Key'} | 
                    Odds-API: ${data.api_status.odds_api === 'active' ? '🟢 Active' : '⚪ No Key'}
                </small>
            </div>`;
            
            data.golden_matches.forEach((match, index) => {
                const pred = match.prediction;
                html += `
                    <div class="golden-match-card" data-aos="fade-up" data-aos-delay="${index * 100}">
                        <div class="d-flex justify-content-between align-items-start mb-3">
                            <span class="badge" style="background: var(--gold-gradient); font-size: 1rem; padding: 10px 15px;">
                                🏆 GOUDEN MATCH ${index + 1}
                            </span>
                            <div class="text-end">
                                <span class="badge bg-success d-block mb-1">
                                    ${match.confidence.toFixed(1)}% Confidence
                                </span>
                                <small class="text-muted">${match.competition}</small>
                            </div>
                        </div>
                        
                        <div class="match-teams">
                            <i class="bi bi-house-fill text-primary"></i> ${match.home_team}
                            <span class="text-muted mx-2">vs</span>
                            <i class="bi bi-airplane-fill text-danger"></i> ${match.away_team}
                        </div>
                        
                        <div class="match-score">${pred.predicted_score}</div>
                        
                        <div class="alert alert-info mt-3 mb-3" style="background: rgba(13, 110, 253, 0.1); border: none;">
                            <i class="bi bi-clock-fill"></i> <strong>${formatKickoff(match.kickoff_time)}</strong>
                        </div>
                        
                        <div class="perfect-scores">
                            ${pred.top_exact_scores ? pred.top_exact_scores.slice(0, 3).map(score => `
                                <div class="score-badge">
                                    <div>${score.score}</div>
                                    <div class="score-probability">${score.probability}%</div>
                                </div>
                            `).join('') : ''}
                        </div>
                        
                        <div class="mt-3 text-muted">
                            <small>
                                <i class="bi bi-graph-up"></i> Verwacht: ${pred.expected_home_goals} - ${pred.expected_away_goals} |
                                <i class="bi bi-database-fill"></i> Bron: ${match.source}
                            </small>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
            showToast('🏆 Gouden wedstrijden gegenereerd uit LIVE data!', 'success');
        });

        // PREDICTION FORM
        document.getElementById('predictionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const spinner = document.getElementById('predictSpinner');
            const text = document.getElementById('predictText');
            const resultDiv = document.getElementById('predictionResult');
            
            spinner.classList.remove('d-none');
            text.textContent = 'Analyseren...';
            resultDiv.innerHTML = '';
            
            const homeTeam = document.getElementById('homeTeam').value;
            const awayTeam = document.getElementById('awayTeam').value;
            const speelronde = document.getElementById('speelronde').value;
            
            const data = await apiCall('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    home_team: homeTeam, 
                    away_team: awayTeam, 
                    speelronde: parseInt(speelronde) 
                })
            });
            
            spinner.classList.add('d-none');
            text.textContent = 'Voorspel Wedstrijd';
            
            if (!data) return;
            
            const pred = data.prediction;
            const analytics = data.analytics;
            
            resultDiv.innerHTML = `
                <div class="prediction-result">
                    <div class="text-center">
                        <h4>${data.home_team} <span class="text-warning">vs</span> ${data.away_team}</h4>
                        <div class="prediction-score">${pred.predicted_score}</div>
                        
                        <div class="confidence-bar">
                            <div class="confidence-fill" style="width: ${pred.confidence_factor}%">
                                ${pred.confidence_factor.toFixed(1)}% Confident
                            </div>
                        </div>
                        
                        <div class="perfect-scores justify-content-center">
                            ${pred.top_exact_scores ? pred.top_exact_scores.slice(0, 3).map(score => `
                                <div class="score-badge">
                                    <div>${score.score}</div>
                                    <div class="score-probability">${score.probability}%</div>
                                </div>
                            `).join('') : ''}
                        </div>
                        
                        <div class="mt-4">
                            <span class="badge badge-custom me-2">${analytics.match_type}</span>
                            <span class="badge badge-custom">Goals: ${analytics.total_goals_expected}</span>
                        </div>
                    </div>
                </div>
            `;
            
            showToast('✅ Voorspelling compleet!', 'success');
        });

        // LOAD STATUS
        const loadStatus = async () => {
            const data = await apiCall('/status');
            if (!data) return;
            
            const stats = data.statistics;
            const container = document.getElementById('statusContainer');
            
            container.innerHTML = `
                <div class="status-item">
                    <span>Engine</span>
                    <span class="badge-custom">${stats.engine}</span>
                </div>
                <div class="status-item">
                    <span>Voorspellingen</span>
                    <span class="badge-custom">${stats.total_predictions}</span>
                </div>
                <div class="status-item">
                    <span>Geleerd</span>
                    <span class="badge-custom">${stats.learned_predictions}</span>
                </div>
                <div class="status-item">
                    <span>Nauwkeurigheid</span>
                    <span class="badge-custom">${stats.current_accuracy}%</span>
                </div>
                <div class="status-item">
                    <span>AI Status</span>
                    <span class="badge-custom">🟢 LIVE</span>
                </div>
            `;
        };

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadStatus();
            showToast('🤖 De Meester AI is geladen', 'success');
        });
    </script>
</body>
</html>
