<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Wedstrijden - PROFESSOR DE MEESTER</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            text-align: center;
        }

        .header h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 1.1em;
        }

        .controls {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .controls button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .controls button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .controls select {
            padding: 12px 20px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            background: white;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .stat-card h3 {
            color: #667eea;
            font-size: 2em;
            margin-bottom: 5px;
        }

        .stat-card p {
            color: #666;
            font-size: 0.9em;
        }

        .loading {
            text-align: center;
            padding: 50px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .loading-spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #667eea;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .matches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
        }

        .match-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: all 0.3s;
            cursor: pointer;
        }

        .match-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .competition {
            font-weight: bold;
            color: #667eea;
            font-size: 0.9em;
        }

        .match-time {
            color: #666;
            font-size: 0.9em;
        }

        .teams {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0;
        }

        .team {
            flex: 1;
            text-align: center;
        }

        .team-name {
            font-size: 1.2em;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .vs {
            font-size: 1.5em;
            color: #667eea;
            font-weight: bold;
            padding: 0 20px;
        }

        .prediction {
            background: #f8f9ff;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
        }

        .prediction-title {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 10px;
        }

        .prediction-value {
            font-size: 1.3em;
            font-weight: bold;
            color: #667eea;
        }

        .win-probabilities {
            display: flex;
            gap: 10px;
            margin: 15px 0;
        }

        .prob-bar {
            flex: 1;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9em;
        }

        .prob-home {
            background: #e3f2fd;
            color: #1976d2;
        }

        .prob-draw {
            background: #fff3e0;
            color: #f57c00;
        }

        .prob-away {
            background: #fce4ec;
            color: #c2185b;
        }

        .match-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn-predict {
            background: #667eea;
            color: white;
        }

        .btn-predict:hover {
            background: #764ba2;
        }

        .btn-value {
            background: #4caf50;
            color: white;
        }

        .btn-value:hover {
            background: #45a049;
        }

        .source-badge {
            display: inline-block;
            padding: 4px 8px;
            background: #e8eaf6;
            color: #667eea;
            border-radius: 5px;
            font-size: 0.8em;
            margin-left: 10px;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
        }

        .recommendation {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            margin-top: 10px;
        }

        .confidence-high {
            border-left: 5px solid #4caf50;
        }

        .confidence-medium {
            border-left: 5px solid #ff9800;
        }

        .confidence-low {
            border-left: 5px solid #f44336;
        }

        @media (max-width: 768px) {
            .matches-grid {
                grid-template-columns: 1fr;
            }

            .header h1 {
                font-size: 1.8em;
            }

            .controls {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏆 LIVE WEDSTRIJDEN VANDAAG/MORGEN</h1>
            <p>Real-time data via API-Football, The Odds API & Odds-Portal</p>
        </div>

        <div class="controls">
            <button onclick="loadMatches()">🔄 Ververs Wedstrijden</button>
            <button onclick="loadEnhancedMatches()">🔥 Enhanced Data (Odds + xG)</button>
            <select id="competitionFilter" onchange="filterMatches()">
                <option value="all">Alle Competities</option>
            </select>
            <select id="sortBy" onchange="filterMatches()">
                <option value="time">Sorteer op Tijd</option>
                <option value="confidence">Sorteer op Confidence</option>
                <option value="quality">Sorteer op Kwaliteit</option>
            </select>
            <button onclick="window.location.href='index.html'">🏠 Terug naar Home</button>
        </div>

        <div class="stats">
            <div class="stat-card">
                <h3 id="totalMatches">0</h3>
                <p>Totaal Wedstrijden</p>
            </div>
            <div class="stat-card">
                <h3 id="totalCompetitions">0</h3>
                <p>Competities</p>
            </div>
            <div class="stat-card">
                <h3 id="bestConfidence">0%</h3>
                <p>Beste Confidence</p>
            </div>
            <div class="stat-card">
                <h3 id="dataSource">-</h3>
                <p>Actieve Bron</p>
            </div>
        </div>

        <div id="loadingDiv" class="loading">
            <div class="loading-spinner"></div>
            <p>Ophalen van live wedstrijden...</p>
        </div>

        <div id="errorDiv" class="error" style="display: none;"></div>

        <div id="matchesContainer" class="matches-grid"></div>
    </div>

    <script>
        let allMatches = [];
        let filteredMatches = [];
        let enhancedMode = false;

        async function loadEnhancedMatches() {
            const loadingDiv = document.getElementById('loadingDiv');
            const errorDiv = document.getElementById('errorDiv');
            const matchesContainer = document.getElementById('matchesContainer');

            loadingDiv.style.display = 'block';
            errorDiv.style.display = 'none';
            matchesContainer.innerHTML = '';

            try {
                const response = await fetch('http://127.0.0.1:5000/api/live-matches/enhanced?include_odds=true&include_xg=true&include_professor=true');
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Fout bij ophalen enhanced matches');
                }

                allMatches = data.matches.map(m => ({
                    ...m,
                    category: 'Enhanced',
                    home_team: m.home,
                    away_team: m.away,
                    competition: m.league,
                    kickoff_time: m.datetime,
                    source: 'Sofascore',
                    confidence: m.professor_prediction?.confidence || 0,
                    prediction: m.professor_prediction ? {
                        most_likely_score: m.professor_prediction.score,
                        confidence_factor: m.professor_prediction.confidence
                    } : null,
                    win_probabilities: m.professor_prediction ? {
                        home_win: m.professor_prediction.home_win_prob,
                        draw: m.professor_prediction.draw_prob,
                        away_win: m.professor_prediction.away_win_prob
                    } : null,
                    recommendation: m.professor_prediction ? getBestRecommendation(m.professor_prediction) : null,
                    recommendation_confidence: m.professor_prediction ? Math.max(
                        m.professor_prediction.home_win_prob,
                        m.professor_prediction.draw_prob,
                        m.professor_prediction.away_win_prob
                    ) : 0,
                    // Enhanced data
                    live_odds: m.odds,
                    home_xg: m.home_xg_for,
                    away_xg: m.away_xg_for,
                    home_form: m.home_form,
                    away_form: m.away_form
                }));

                filteredMatches = [...allMatches];
                enhancedMode = true;

                updateStats(data);
                populateCompetitionFilter();
                displayMatches();

                loadingDiv.style.display = 'none';

            } catch (error) {
                console.error('Error:', error);
                loadingDiv.style.display = 'none';
                errorDiv.style.display = 'block';
                errorDiv.innerHTML = `
                    <h3>❌ Fout bij laden</h3>
                    <p>${error.message}</p>
                    <button onclick="loadEnhancedMatches()" style="margin-top: 10px; padding: 10px 20px; background: #667eea; color: white; border: none; border-radius: 5px; cursor: pointer;">Probeer Opnieuw</button>
                `;
            }
        }

        function getBestRecommendation(pred) {
            const probs = {
                home: pred.home_win_prob,
                draw: pred.draw_prob,
                away: pred.away_win_prob
            };
            
            const max = Math.max(probs.home, probs.draw, probs.away);
            
            if (probs.home === max) return 'THUIS WINT';
            if (probs.away === max) return 'UIT WINT';
            return 'GELIJKSPEL';
        }

        async function loadMatches() {
            const loadingDiv = document.getElementById('loadingDiv');
            const errorDiv = document.getElementById('errorDiv');
            const matchesContainer = document.getElementById('matchesContainer');

            loadingDiv.style.display = 'block';
            errorDiv.style.display = 'none';
            matchesContainer.innerHTML = '';

            try {
                const response = await fetch('http://127.0.0.1:5000/api/golden-matches');
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Fout bij ophalen wedstrijden');
                }

                // Verzamel ALLE matches uit alle categorieën
                allMatches = [];
                
                if (data.perfect_score_matches) {
                    allMatches = allMatches.concat(data.perfect_score_matches.map(m => ({...m, category: 'Perfect Score'})));
                }
                if (data.best_bet_matches) {
                    allMatches = allMatches.concat(data.best_bet_matches.map(m => ({...m, category: 'Best Bet'})));
                }
                if (data.golden_eerste_divisie) {
                    allMatches.push({...data.golden_eerste_divisie, category: 'Golden Eerste Divisie'});
                }

                // Verwijder duplicaten
                const uniqueMatches = [];
                const seen = new Set();
                for (const match of allMatches) {
                    const key = `${match.home_team}:${match.away_team}`;
                    if (!seen.has(key)) {
                        seen.add(key);
                        uniqueMatches.push(match);
                    }
                }

                allMatches = uniqueMatches;
                filteredMatches = [...allMatches];

                // Update statistieken
                updateStats(data);

                // Populate competitie filter
                populateCompetitionFilter();

                // Toon wedstrijden
                displayMatches();

                loadingDiv.style.display = 'none';

            } catch (error) {
                console.error('Error:', error);
                loadingDiv.style.display = 'none';
                errorDiv.style.display = 'block';
                errorDiv.innerHTML = `
                    <h3>❌ Fout bij laden</h3>
                    <p>${error.message}</p>
                    <button onclick="loadMatches()" style="margin-top: 10px; padding: 10px 20px; background: #667eea; color: white; border: none; border-radius: 5px; cursor: pointer;">Probeer Opnieuw</button>
                `;
            }
        }

        function updateStats(data) {
            document.getElementById('totalMatches').textContent = allMatches.length;
            
            const competitions = new Set(allMatches.map(m => m.competition));
            document.getElementById('totalCompetitions').textContent = competitions.size;

            const maxConfidence = Math.max(...allMatches.map(m => m.confidence || 0));
            document.getElementById('bestConfidence').textContent = maxConfidence.toFixed(1) + '%';

            const sources = data.sources_used || [];
            document.getElementById('dataSource').textContent = sources[0] || 'N/A';
        }

        function populateCompetitionFilter() {
            const competitions = [...new Set(allMatches.map(m => m.competition))].sort();
            const select = document.getElementById('competitionFilter');
            
            select.innerHTML = '<option value="all">Alle Competities</option>';
            competitions.forEach(comp => {
                const option = document.createElement('option');
                option.value = comp;
                option.textContent = comp;
                select.appendChild(option);
            });
        }

        function filterMatches() {
            const competitionFilter = document.getElementById('competitionFilter').value;
            const sortBy = document.getElementById('sortBy').value;

            // Filter
            filteredMatches = allMatches.filter(match => {
                if (competitionFilter === 'all') return true;
                return match.competition === competitionFilter;
            });

            // Sort
            if (sortBy === 'time') {
                filteredMatches.sort((a, b) => new Date(a.kickoff_time) - new Date(b.kickoff_time));
            } else if (sortBy === 'confidence') {
                filteredMatches.sort((a, b) => (b.confidence || 0) - (a.confidence || 0));
            } else if (sortBy === 'quality') {
                filteredMatches.sort((a, b) => (b.quality_score || 0) - (a.quality_score || 0));
            }

            displayMatches();
        }

        function displayMatches() {
            const container = document.getElementById('matchesContainer');
            container.innerHTML = '';

            if (filteredMatches.length === 0) {
                container.innerHTML = '<div class="error">Geen wedstrijden gevonden met de huidige filters.</div>';
                return;
            }

            filteredMatches.forEach(match => {
                const card = createMatchCard(match);
                container.appendChild(card);
            });
        }

        function createMatchCard(match) {
            const card = document.createElement('div');
            card.className = 'match-card';
            
            // Bepaal confidence class
            const confidence = match.confidence || 0;
            let confidenceClass = 'confidence-low';
            if (confidence > 70) confidenceClass = 'confidence-high';
            else if (confidence > 50) confidenceClass = 'confidence-medium';
            
            card.classList.add(confidenceClass);

            const kickoffDate = new Date(match.kickoff_time);
            const timeStr = kickoffDate.toLocaleString('nl-NL', {
                day: 'numeric',
                month: 'short',
                hour: '2-digit',
                minute: '2-digit'
            });

            const prediction = match.prediction || {};
            const winProbs = match.win_probabilities || {};
            const liveOdds = match.live_odds || {};

            card.innerHTML = `
                <div class="match-header">
                    <div>
                        <span class="competition">${match.competition}</span>
                        <span class="source-badge">${match.source || 'API'}</span>
                        ${enhancedMode ? '<span class="source-badge" style="background: #4caf50; color: white;">ENHANCED</span>' : ''}
                    </div>
                    <div class="match-time">⏰ ${timeStr}</div>
                </div>

                <div class="teams">
                    <div class="team">
                        <div class="team-name">🏠 ${match.home_team}</div>
                        ${match.home_form ? `<small style="color: #666;">📊 ${match.home_form}</small>` : ''}
                    </div>
                    <div class="vs">VS</div>
                    <div class="team">
                        <div class="team-name">✈️ ${match.away_team}</div>
                        ${match.away_form ? `<small style="color: #666;">📊 ${match.away_form}</small>` : ''}
                    </div>
                </div>

                ${match.home_xg && match.away_xg ? `
                    <div style="background: #f0f8ff; padding: 10px; border-radius: 8px; margin: 10px 0; text-align: center;">
                        <small style="color: #666;">Expected Goals (xG)</small><br>
                        <strong style="color: #667eea;">${match.home_xg.toFixed(2)} - ${match.away_xg.toFixed(2)}</strong>
                    </div>
                ` : ''}

                ${liveOdds['1'] ? `
                    <div style="background: #fff8e1; padding: 10px; border-radius: 8px; margin: 10px 0;">
                        <div style="display: flex; justify-content: space-around; text-align: center;">
                            <div>
                                <small style="color: #666;">Thuis</small><br>
                                <strong style="color: #f57c00;">${liveOdds['1']}</strong>
                            </div>
                            <div>
                                <small style="color: #666;">Gelijk</small><br>
                                <strong style="color: #f57c00;">${liveOdds['X']}</strong>
                            </div>
                            <div>
                                <small style="color: #666;">Uit</small><br>
                                <strong style="color: #f57c00;">${liveOdds['2']}</strong>
                            </div>
                        </div>
                    </div>
                ` : ''}

                ${prediction.most_likely_score ? `
                    <div class="prediction">
                        <div class="prediction-title">🎯 PROFESSOR Voorspelling</div>
                        <div class="prediction-value">${prediction.most_likely_score}</div>
                        <small style="color: #666;">Confidence: ${confidence.toFixed(1)}%</small>
                    </div>
                ` : ''}

                ${winProbs.home_win ? `
                    <div class="win-probabilities">
                        <div class="prob-bar prob-home">
                            <strong>Thuis</strong><br>
                            ${winProbs.home_win.toFixed(1)}%
                        </div>
                        <div class="prob-bar prob-draw">
                            <strong>Gelijk</strong><br>
                            ${winProbs.draw.toFixed(1)}%
                        </div>
                        <div class="prob-bar prob-away">
                            <strong>Uit</strong><br>
                            ${winProbs.away_win.toFixed(1)}%
                        </div>
                    </div>
                ` : ''}

                ${match.recommendation ? `
                    <div class="recommendation">
                        💎 ${match.recommendation}
                        <br>
                        <small>${match.recommendation_confidence.toFixed(1)}% zekerheid</small>
                    </div>
                ` : ''}

                <div class="match-actions">
                    <button class="btn btn-predict" onclick="predictMatch('${match.home_team}', '${match.away_team}')">
                        🔮 Voorspelling
                    </button>
                    ${liveOdds['1'] ? `
                        <button class="btn btn-value" onclick="valueAnalysisWithOdds('${match.home_team}', '${match.away_team}', ${liveOdds['1']}, ${liveOdds['X']}, ${liveOdds['2']})">
                            💰 Value Bets
                        </button>
                    ` : `
                        <button class="btn btn-value" onclick="valueAnalysis('${match.home_team}', '${match.away_team}')">
                            💰 Value Bets
                        </button>
                    `}
                </div>
            `;

            return card;
        }

        function predictMatch(homeTeam, awayTeam) {
            // Open main prediction page met teams
            window.location.href = `index.html?home=${encodeURIComponent(homeTeam)}&away=${encodeURIComponent(awayTeam)}`;
        }

        function valueAnalysis(homeTeam, awayTeam) {
            alert(`Value betting analyse voor ${homeTeam} vs ${awayTeam}\n\nDeze functie komt binnenkort! 🎯`);
            // TODO: Link naar value betting pagina
        }

        function valueAnalysisWithOdds(homeTeam, awayTeam, odds1, oddsX, odds2) {
            // Direct API call voor value betting met odds
            alert(`💰 Value Betting Analyse\n\n${homeTeam} vs ${awayTeam}\n\nOdds: ${odds1} / ${oddsX} / ${odds2}\n\nDeze functie komt binnenkort met volledige EV analyse!`);
            // TODO: POST naar /api/value-betting met odds
        }

        // Auto-load bij page load
        window.onload = loadMatches;

        // Auto-refresh elke 5 minuten
        setInterval(loadMatches, 5 * 60 * 1000);
    </script>
</body>
</html>
