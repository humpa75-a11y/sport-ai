<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>De Meester - Voetbal Voorspellingen</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <div class="container">
        <header class="mega-header">
            <h1>🏆 DE MEESTER 🏆</h1>
            <p class="subtitle">Ultimate Score Prediction AI</p>
        </header>

        <main>
            <div class="prediction-form">
                <h2>Voorspel een Wedstrijd</h2>
                <form id="predict-form">
                    <div class="form-group">
                        <input type="text" id="home-team" placeholder="Thuisploeg" required>
                        <span>VS</span>
                        <input type="text" id="away-team" placeholder="Uitploeg" required>
                    </div>
                    <button type="submit" id="predict-button">Voorspel Score</button>
                </form>
            </div>

            <div id="prediction-result" class="hidden">
                <!-- Resultaten worden hier dynamisch ingevoegd -->
            </div>

            <div class="status-section">
                <h2>AI Status</h2>
                <pre id="status-report">Status wordt geladen...</pre>
            </div>
        </main>

        <footer class="footer">
            <p>De Leerling is De Meester Geworden</p>
        </footer>
    </div>

    <script src="static/script.js"></script>
</body>
</html>
