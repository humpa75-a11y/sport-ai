<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ De Meester AI - Smart Betting</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glow-gold { box-shadow: 0 0 20px rgba(251, 191, 36, 0.5); }
        .glow-green { box-shadow: 0 0 15px rgba(34, 197, 94, 0.4); }
        @keyframes pulse-gold {
            0%, 100% { box-shadow: 0 0 20px rgba(251, 191, 36, 0.5); }
            50% { box-shadow: 0 0 30px rgba(251, 191, 36, 0.8); }
        }
        .pulse-gold { animation: pulse-gold 2s infinite; }
    </style>
</head>
<body class="bg-gray-950 text-white">
    <!-- Compact Header -->
    <header class="bg-gradient-to-r from-gray-900 to-gray-800 border-b border-yellow-500/30 p-3">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">⚽</span>
                <div>
                    <h1 class="text-xl font-bold text-yellow-400">De Meester AI</h1>
                    <p class="text-xs text-gray-400">Smart Betting System</p>
                </div>
            </div>
            <div class="flex items-center space-x-3 text-sm">
                <div class="bg-gray-800 px-3 py-1 rounded">
                    <span class="text-green-400 font-bold" id="bankroll">€1,000</span>
                </div>
                <div class="bg-gray-800 px-3 py-1 rounded">
                    <span class="text-yellow-400" id="win-rate">0% win</span>
                </div>
                <button id="refresh-btn" class="bg-blue-600 hover:bg-blue-700 px-3 py-1 rounded text-xs">
                    🔄 Refresh
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4">
        <!-- Controls -->
        <div class="mb-4 flex gap-3 items-center">
            <select id="league-select" class="bg-gray-800 border border-gray-600 rounded px-3 py-1 text-sm">
                <option value="bundesliga">🇩🇪 Bundesliga</option>
                <option value="premier-league">🏴 Premier League</option>
                <option value="eredivisie">🇳🇱 Eredivisie</option>
            </select>
            <select id="days-select" class="bg-gray-800 border border-gray-600 rounded px-3 py-1 text-sm">
                <option value="1">Vandaag</option>
                <option value="2" selected>2 dagen</option>
                <option value="3">3 dagen</option>
            </select>
            <span class="text-xs text-gray-500 ml-auto" id="last-update">Loading...</span>
        </div>

        <!-- 💎 GOLDEN TIP - Top Value Bet -->
        <div id="golden-tip" class="mb-6 bg-gradient-to-br from-yellow-900/40 to-yellow-800/20 border-2 border-yellow-500 rounded-lg p-4 pulse-gold">
            <div class="flex items-center justify-between mb-3">
                <h2 class="text-lg font-bold text-yellow-400">💎 GOLDEN TIP</h2>
                <span class="text-xs bg-yellow-500 text-black px-2 py-1 rounded font-bold">HIGHEST VALUE</span>
            </div>
            <div id="golden-tip-content" class="text-center text-gray-400">
                Laden...
            </div>
        </div>

        <!-- 🎯 MONSTER ODDS - Correct Scores -->
        <div class="mb-6 bg-gray-900 border border-purple-500/30 rounded-lg p-4">
            <h2 class="text-lg font-bold text-purple-400 mb-3">🎯 MONSTER ODDS - Correct Scores</h2>
            <div id="monster-odds" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                <!-- Monster odds will load here -->
            </div>
        </div>

        <!-- 🏆 TOP 3 PREDICTIONS -->
        <div class="mb-6 bg-gray-900 border border-green-500/30 rounded-lg p-4">
            <h2 class="text-lg font-bold text-green-400 mb-3">🏆 TOP 3 PREDICTIONS</h2>
            <div id="top-3" class="space-y-3">
                <!-- Top 3 will load here -->
            </div>
        </div>

        <!-- 📋 ALL MATCHES -->
        <div class="bg-gray-900 border border-gray-700 rounded-lg p-4">
            <h2 class="text-lg font-bold text-gray-300 mb-3">📋 Alle Wedstrijden</h2>
            <div id="all-matches" class="space-y-2">
                <!-- All matches will load here -->
            </div>
        </div>

        <!-- Loading -->
        <div id="loading" class="text-center py-12">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-yellow-400 mb-2"></div>
            <p class="text-gray-400 text-sm">Laden...</p>
        </div>
    </main>

    <script>
        const API_BASE = 'http://206.189.101.98:5000';
        let allMatches = [];

        // Generate realistic correct score prediction
        function generateCorrectScore(match) {
            // Base probabilities for common scores
            const scores = [
                { score: '1-0', odds: 7.5, prob: 0.13 },
                { score: '2-0', odds: 9.0, prob: 0.11 },
                { score: '2-1', odds: 8.5, prob: 0.12 },
                { score: '1-1', odds: 6.5, prob: 0.15 },
                { score: '0-0', odds: 9.5, prob: 0.10 },
                { score: '3-1', odds: 15.0, prob: 0.07 },
                { score: '3-0', odds: 17.0, prob: 0.06 },
                { score: '2-2', odds: 12.0, prob: 0.08 },
                { score: '0-1', odds: 11.0, prob: 0.09 },
                { score: '1-2', odds: 10.0, prob: 0.09 }
            ];

            // Find match result prediction
            const matchResult = match.predictions.find(p => p.market === 'Match Result');
            const btts = match.predictions.find(p => p.market === 'BTTS');
            const over25 = match.predictions.find(p => p.market === 'Over 2.5');

            // Adjust probabilities based on predictions
            let selectedScores = [...scores];
            
            if (matchResult) {
                if (matchResult.prediction === 'Home Win') {
                    selectedScores = scores.filter(s => {
                        const [home, away] = s.score.split('-').map(Number);
                        return home > away;
                    });
                } else if (matchResult.prediction === 'Away Win') {
                    selectedScores = scores.filter(s => {
                        const [home, away] = s.score.split('-').map(Number);
                        return away > home;
                    });
                }
            }

            if (btts && btts.prediction === 'Yes') {
                selectedScores = selectedScores.filter(s => {
                    const [home, away] = s.score.split('-').map(Number);
                    return home > 0 && away > 0;
                });
            }

            if (over25 && over25.prediction === 'Yes') {
                selectedScores = selectedScores.filter(s => {
                    const [home, away] = s.score.split('-').map(Number);
                    return (home + away) >= 3;
                });
            }

            // Return top 3 most likely scores
            return selectedScores.slice(0, 3).map(s => ({
                ...s,
                ev_pct: ((s.prob * s.odds - 1) * 100).toFixed(0)
            }));
        }

        // Render Golden Tip
        function renderGoldenTip() {
            console.log('renderGoldenTip called, matches:', allMatches.length);
            if (allMatches.length === 0) return;

            // Find bet with highest EV (no minimum threshold)
            let bestBet = null;
            let bestEV = -999999; // Start with very low number

            allMatches.forEach(match => {
                match.predictions.forEach(pred => {
                    // Calculate score based on EV and confidence
                    const score = pred.ev_pct + (pred.confidence * 100);
                    const currentBestScore = bestBet ? (bestBet.prediction.ev_pct + (bestBet.prediction.confidence * 100)) : -999999;
                    
                    if (score > currentBestScore) {
                        bestBet = { match, prediction: pred };
                    }
                });
            });

            console.log('Best bet found:', bestBet);

            if (!bestBet) {
                document.getElementById('golden-tip-content').innerHTML = 
                    '<p class="text-gray-500">Geen golden tips beschikbaar</p>';
                return;
            }

            const { match, prediction } = bestBet;
            const scores = generateCorrectScore(match);
            const predictedScore = scores[0].score;

            document.getElementById('golden-tip-content').innerHTML = `
                <div class="text-left">
                    <div class="flex justify-between items-start mb-2">
                        <div>
                            <h3 class="font-bold text-xl text-white">${match.home_team} vs ${match.away_team}</h3>
                            <p class="text-sm text-gray-400">${new Date(match.match_date).toLocaleDateString('nl-NL')} • ${match.match_time}</p>
                        </div>
                        <div class="text-right">
                            <div class="text-3xl font-bold text-yellow-400">${predictedScore}</div>
                            <div class="text-xs text-gray-400">voorspeld</div>
                        </div>
                    </div>
                    <div class="grid grid-cols-3 gap-3 mt-3">
                        <div class="bg-gray-800 rounded p-2 text-center">
                            <div class="text-xs text-gray-400">Market</div>
                            <div class="font-bold text-white text-sm">${prediction.market}</div>
                        </div>
                        <div class="bg-gray-800 rounded p-2 text-center">
                            <div class="text-xs text-gray-400">Odds</div>
                            <div class="font-bold text-green-400 text-sm">${prediction.odds.toFixed(2)}</div>
                        </div>
                        <div class="bg-gray-800 rounded p-2 text-center">
                            <div class="text-xs text-gray-400">Expected Value</div>
                            <div class="font-bold text-yellow-400 text-sm">+${prediction.ev_pct.toFixed(0)}%</div>
                        </div>
                    </div>
                    <div class="mt-3 bg-yellow-500/10 border border-yellow-500/30 rounded p-2">
                        <div class="flex justify-between items-center">
                            <span class="text-xs text-yellow-400">Confidence: ${(prediction.confidence * 100).toFixed(0)}%</span>
                            <span class="text-xs text-yellow-400">Probability: ${(prediction.probability * 100).toFixed(0)}%</span>
                        </div>
                    </div>
                </div>
            `;
        }

        // Render Monster Odds
        function renderMonsterOdds() {
            const container = document.getElementById('monster-odds');
            if (allMatches.length === 0) {
                container.innerHTML = '<p class="text-gray-500 col-span-3">Geen monster odds beschikbaar</p>';
                return;
            }

            // Take top 6 matches with highest confidence
            const topMatches = [...allMatches]
                .sort((a, b) => {
                    const aMax = Math.max(...a.predictions.map(p => p.confidence));
                    const bMax = Math.max(...b.predictions.map(p => p.confidence));
                    return bMax - aMax;
                })
                .slice(0, 6);

            container.innerHTML = topMatches.map(match => {
                const scores = generateCorrectScore(match);
                const topScore = scores[0];

                return `
                    <div class="bg-gray-800 rounded-lg p-3 border border-purple-500/30 hover:border-purple-500 transition">
                        <div class="flex justify-between items-start mb-2">
                            <div class="flex-1">
                                <h4 class="font-bold text-sm text-white">${match.home_team}</h4>
                                <h4 class="font-bold text-sm text-white">${match.away_team}</h4>
                                <p class="text-xs text-gray-500">${new Date(match.match_date).toLocaleDateString('nl-NL')}</p>
                            </div>
                            <div class="text-right">
                                <div class="text-2xl font-bold text-purple-400">${topScore.score}</div>
                                <div class="text-xs text-gray-400">${topScore.odds.toFixed(1)}x</div>
                            </div>
                        </div>
                        <div class="flex justify-between text-xs mt-2 pt-2 border-t border-gray-700">
                            <span class="text-gray-400">Kans: ${(topScore.prob * 100).toFixed(0)}%</span>
                            <span class="text-purple-400 font-bold">EV: +${topScore.ev_pct}%</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Render Top 3
        function renderTop3() {
            const container = document.getElementById('top-3');
            if (allMatches.length === 0) {
                container.innerHTML = '<p class="text-gray-500">Geen predictions beschikbaar</p>';
                return;
            }

            // Find top 3 predictions by confidence
            const allPredictions = [];
            allMatches.forEach(match => {
                match.predictions.forEach(pred => {
                    allPredictions.push({
                        match,
                        prediction: pred
                    });
                });
            });

            const top3 = allPredictions
                .sort((a, b) => b.prediction.confidence - a.prediction.confidence)
                .slice(0, 3);

            container.innerHTML = top3.map((item, index) => {
                const { match, prediction } = item;
                const scores = generateCorrectScore(match);
                const medal = ['🥇', '🥈', '🥉'][index];

                return `
                    <div class="bg-gray-800 rounded-lg p-3 border-2 border-green-500/50 glow-green">
                        <div class="flex justify-between items-start">
                            <div class="flex-1">
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="text-2xl">${medal}</span>
                                    <div>
                                        <h4 class="font-bold text-white">${match.home_team} vs ${match.away_team}</h4>
                                        <p class="text-xs text-gray-400">${new Date(match.match_date).toLocaleDateString('nl-NL')} • ${match.match_time}</p>
                                    </div>
                                </div>
                                <div class="grid grid-cols-4 gap-2 mt-2">
                                    <div class="bg-gray-900 rounded p-2 text-center">
                                        <div class="text-xs text-gray-400">Score</div>
                                        <div class="font-bold text-white">${scores[0].score}</div>
                                    </div>
                                    <div class="bg-gray-900 rounded p-2 text-center">
                                        <div class="text-xs text-gray-400">Market</div>
                                        <div class="font-bold text-white text-xs">${prediction.market}</div>
                                    </div>
                                    <div class="bg-gray-900 rounded p-2 text-center">
                                        <div class="text-xs text-gray-400">Odds</div>
                                        <div class="font-bold text-green-400">${prediction.odds.toFixed(2)}</div>
                                    </div>
                                    <div class="bg-gray-900 rounded p-2 text-center">
                                        <div class="text-xs text-gray-400">Confidence</div>
                                        <div class="font-bold text-green-400">${(prediction.confidence * 100).toFixed(0)}%</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Render All Matches
        function renderAllMatches() {
            const container = document.getElementById('all-matches');
            if (allMatches.length === 0) {
                container.innerHTML = '<p class="text-gray-500">Geen wedstrijden beschikbaar</p>';
                return;
            }

            container.innerHTML = allMatches.map(match => {
                const bestPred = match.predictions.reduce((best, curr) => 
                    curr.confidence > best.confidence ? curr : best
                );
                const scores = generateCorrectScore(match);

                return `
                    <div class="bg-gray-800 rounded-lg p-3 border border-gray-700 hover:border-gray-500 transition">
                        <div class="flex justify-between items-start">
                            <div class="flex-1">
                                <h4 class="font-bold text-white text-sm">${match.home_team} vs ${match.away_team}</h4>
                                <p class="text-xs text-gray-400">${new Date(match.match_date).toLocaleDateString('nl-NL')} • ${match.match_time}</p>
                            </div>
                            <div class="text-right">
                                <div class="text-lg font-bold text-yellow-400">${scores[0].score}</div>
                                <div class="text-xs text-gray-400">${scores[0].odds.toFixed(1)}x</div>
                            </div>
                        </div>
                        <div class="grid grid-cols-4 gap-2 mt-2 text-xs">
                            <div class="text-center">
                                <div class="text-gray-400">Market</div>
                                <div class="font-bold text-white">${bestPred.market}</div>
                            </div>
                            <div class="text-center">
                                <div class="text-gray-400">Pred</div>
                                <div class="font-bold text-white">${bestPred.prediction}</div>
                            </div>
                            <div class="text-center">
                                <div class="text-gray-400">Conf</div>
                                <div class="font-bold text-green-400">${(bestPred.confidence * 100).toFixed(0)}%</div>
                            </div>
                            <div class="text-center">
                                <div class="text-gray-400">EV</div>
                                <div class="font-bold text-yellow-400">+${bestPred.ev_pct.toFixed(0)}%</div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Load all data
        async function loadData() {
            try {
                document.getElementById('loading').classList.remove('hidden');
                
                const league = document.getElementById('league-select').value;
                const days = document.getElementById('days-select').value;

                // Load predictions
                const predResponse = await fetch(`${API_BASE}/api/predictions?league=${league}&days_ahead=${days}`);
                const predData = await predResponse.json();
                allMatches = predData.matches || [];

                console.log('Loaded matches:', allMatches.length);
                if (allMatches.length > 0) {
                    console.log('Sample match:', allMatches[0]);
                    console.log('Sample predictions:', allMatches[0].predictions);
                }

                // Load bankroll
                const bankrollResponse = await fetch(`${API_BASE}/api/bankroll`);
                const bankrollData = await bankrollResponse.json();
                
                document.getElementById('bankroll').textContent = `€${bankrollData.current_bankroll.toFixed(0)}`;
                document.getElementById('win-rate').textContent = `${(bankrollData.win_rate * 100).toFixed(0)}% win`;

                // Render all sections
                renderGoldenTip();
                renderMonsterOdds();
                renderTop3();
                renderAllMatches();

                document.getElementById('last-update').textContent = new Date().toLocaleTimeString('nl-NL');
                document.getElementById('loading').classList.add('hidden');
            } catch (error) {
                console.error('Error loading data:', error);
                document.getElementById('loading').innerHTML = 
                    '<p class="text-red-400">Fout bij laden. Probeer opnieuw.</p>';
            }
        }

        // Event listeners
        document.getElementById('refresh-btn').addEventListener('click', loadData);
        document.getElementById('league-select').addEventListener('change', loadData);
        document.getElementById('days-select').addEventListener('change', loadData);

        // Initial load
        loadData();
    </script>
</body>
</html>
